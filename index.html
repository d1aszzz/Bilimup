<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilimup — English Platform</title>
<style>
:root{--bg:#0b1024;--tx:#eaf0ff;--mu:#93a0c6;--ac:#5eead4;--ac2:#8b5cf6;--ok:#34d399;--bad:#f87171;--wn:#fbbf24;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.13);--in:rgba(0,0,0,.25);--sf:#141a3a;--hv:rgba(255,255,255,.08);--g1:#26307a55;--g2:#0f766e55;color-scheme:dark}
[data-theme=light]{--bg:#eef2ff;--tx:#1b2140;--mu:#5b6488;--ac:#0d9488;--ok:#059669;--bad:#dc2626;--wn:#b45309;--gl:rgba(255,255,255,.72);--bd:rgba(30,40,100,.15);--in:rgba(255,255,255,.9);--sf:#fff;--hv:rgba(30,40,100,.07);--g1:#a5b4fc77;--g2:#99f6e488;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(900px 600px at 10% -10%,var(--g1),transparent),radial-gradient(700px 500px at 100% 100%,var(--g2),transparent),var(--bg);display:flex;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.glass{background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
aside{width:270px;flex:none;padding:18px;display:flex;flex-direction:column;gap:16px;height:100%;overflow:auto;border-radius:0 22px 22px 0;z-index:20;transition:transform .3s}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}.logo small{display:block;font-weight:500;font-size:12px;color:var(--mu)}
.prof{display:flex;gap:12px;align-items:center;padding:12px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac2),var(--ac));display:grid;place-items:center;font-weight:800;font-size:20px;color:#0b1024;flex:none;background-size:cover;background-position:center}.av.sm{width:34px;height:34px;font-size:14px}
.prof b{display:block}.prof span{font-size:13px;color:var(--mu)}
nav{display:flex;flex-direction:column;gap:6px}
nav button{background:none;border:1px solid transparent;text-align:left;padding:11px 13px;border-radius:12px;color:var(--mu);transition:.2s}
nav button:hover{background:var(--gl);color:var(--tx)}
nav button.on{background:linear-gradient(90deg,#8b5cf633,#5eead422);border-color:var(--bd);color:var(--tx)}
main{flex:1;min-width:0;height:100%;overflow:auto;padding:26px 30px 110px}
.fade{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;letter-spacing:-.5px;margin-bottom:6px}h2{font-size:19px;margin:24px 0 12px}
h3{margin:16px 0 8px}
p.sub{color:var(--mu);margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{padding:16px}
.stat b{font-size:30px;display:block;letter-spacing:-1px}.stat span{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:9px;background:var(--hv);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .5s}
.btn{background:linear-gradient(90deg,var(--ac2),#6366f1);border:0;padding:11px 20px;border-radius:12px;font-weight:700;color:#fff;transition:.2s}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:var(--gl);border:1px solid var(--bd)}
.ls{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:8px;width:100%;text-align:left;border-radius:14px;background:var(--gl);border:1px solid var(--bd)}
.ls em{margin-left:auto;font-style:normal;font-size:13px}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;background:#000}
textarea{width:100%;min-height:110px;margin-top:8px;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:12px;resize:vertical}
input.nm,select.nm{width:100%;padding:12px;margin:10px 0;border-radius:12px;border:1px solid var(--bd);background:var(--in)}
input.line{background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-width:140px}
.cnt{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;font-weight:700;font-size:13px}
.cnt.r,.bg.r{background:#f8717133;color:var(--bad)}.cnt.g,.bg.g{background:#34d39933;color:var(--ok)}
.bg{font-size:12px;padding:3px 10px;border-radius:99px;margin-left:8px;vertical-align:middle;font-weight:600}
.art{margin-bottom:14px;color:var(--tx);max-width:75ch;white-space:pre-wrap}
.q{margin-bottom:14px}.opt{display:block;width:100%;text-align:left;margin-top:6px;padding:9px 13px;border-radius:10px;background:var(--hv);border:1px solid var(--bd);transition:.15s}
.opt:hover{border-color:var(--ac)}.opt.ok,input.ok{background:#34d39926;border-color:var(--ok)}.opt.bad,input.bad{background:#f8717126;border-color:var(--bad)}
.gap{line-height:2.4;font-size:17px;max-width:75ch}
.gap input{background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:3px 8px;text-align:center;min-width:60px}
.mod{position:fixed;inset:0;background:rgba(5,8,20,.75);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:60;padding:16px;overflow:auto}
.mod .glass{max-width:560px;width:100%;padding:26px;background:var(--sf)}
#fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;font-size:26px;background:linear-gradient(135deg,var(--ac2),var(--ac));box-shadow:0 8px 24px #8b5cf688;z-index:40;transition:.2s}
#fab:hover{transform:scale(1.08)}
#chat{position:fixed;right:20px;bottom:90px;width:360px;max-width:calc(100vw - 32px);height:460px;max-height:calc(100% - 120px);display:none;flex-direction:column;z-index:41;background:var(--sf);overflow:hidden}
#chat.open{display:flex;animation:in .25s}
#chat header{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--bd)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--ac2)}.m.b{background:var(--hv)}
#cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}#cf input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--in)}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#0f766e;padding:10px 20px;border-radius:12px;z-index:80;display:none;font-weight:600}
#burger{display:none}
@media(max-width:820px){
body{display:block}
aside{position:fixed;left:0;top:0;transform:translateX(-105%);background:var(--sf);width:280px}
aside.open{transform:none}
#burger{display:block;position:fixed;top:12px;left:12px;z-index:30;padding:8px 13px;border-radius:12px;background:var(--sf);border:1px solid var(--bd)}
main{padding:64px 16px 110px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.err{border-left:3px solid var(--bad);padding:8px 12px;margin:8px 0;background:var(--hv);border-radius:8px}.err.good{border-color:var(--ok)}
.tfrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:8px 10px;border-radius:10px;background:var(--hv)}
.tfrow b{flex:1;min-width:200px}
.tfrow button{padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--gl)}
.tfrow button.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
.bookgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.bookcard{text-align:left;padding:0;overflow:hidden;border-radius:16px;background:var(--gl);border:1px solid var(--bd);transition:.2s;display:flex;flex-direction:column}
.bookcard:hover{transform:translateY(-3px);border-color:var(--ac)}
.bookcard .cover{aspect-ratio:3/4;width:100%;background:var(--hv);display:grid;place-items:center;overflow:hidden}
.bookcard .cover img{width:100%;height:100%;object-fit:cover;display:block}
.bookcard .meta{padding:10px 12px}
.bookcard .meta b{display:block;font-size:15px}
.bookcard .meta span{font-size:12px;color:var(--mu)}
.bookdetail{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
@media(max-width:700px){.bookdetail{grid-template-columns:1fr}}
.bookdetail .cover{aspect-ratio:3/4;border-radius:14px;background:var(--hv);overflow:hidden;display:grid;place-items:center}
.bookdetail .cover img{width:100%;height:100%;object-fit:cover}
.hint{font-size:12px;color:var(--mu)}
.word{display:inline-block;padding:1px 5px;border-radius:6px;background:#8b5cf626;border-bottom:1px dashed var(--ac);cursor:pointer;color:var(--tx);font-weight:600}
.word:hover{background:#8b5cf655}
.word .star{font-size:11px;color:var(--wn);margin-left:2px}
.flash-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));perspective:1200px}
.flip{position:relative;width:100%;min-height:170px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.flip.open{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--bd);background:var(--gl);padding:14px;display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:center;text-align:center;overflow:auto}
.flip .face.back{transform:rotateY(180deg);align-items:flex-start;text-align:left;font-size:14px}
.flip .face b{font-size:20px;color:var(--tx)}
.flip .face .meaning{font-size:14px;color:var(--tx)}
.flip .face .kk{font-size:14px;color:var(--ac);font-weight:600}
.flip .face .muted{color:var(--mu);font-size:12px}
.word-detail{padding:14px 16px}
.word-detail h2{margin:0 0 6px;font-size:24px}
.word-detail .meaning{font-size:16px;margin:10px 0}
.word-detail .kk{font-size:16px;color:var(--ac);font-weight:700;margin:6px 0 12px}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt.sel{background:rgba(139,92,246,.30);border-color:var(--ac2)}
</style>
</head>

  <div class="logo">✦ Bilimup<small>English Platform · B1</small></div>

<main id="main"></main>

 {type:'gap',title:'Task 3. Gap Filling',text:`We don't have {0} water left in the container; please buy {1} bottle on your way home.

There are {3} people in the queue; we won't have {4} time to catch our train.
He bought a loaf of bread, a bar of chocolate, and {5} fresh milk from the local dairy.`,

 {type:'tfrm',title:'Task 4. Sentence Transformation (2–5 words)',items:[

 {type:'read',title:'Task 3. Reading Comprehension (full sentences)',text:`Living in Tokyo presents a unique blend of traditional customs and high-tech convenience. Kenji, a software developer, used to live in a quiet rural village in Nagano. Today, he lives in a compact city apartment and travels on crowded trains every morning. "At first, the noise bothered me," he explains. "However, I am gradually getting used to the pace of urban life. Right now, our company is developing a new mobile application, so I am working longer hours than usual."`,

{n:3,video:'ZTPqEkSZZQQ',focus:'-ing Form / Infinitive, Reported Speech, Introductory Verbs, Negative Adjectives',

 {type:'insert',title:'Task 1. Gapped Text (one extra sentence A–D)',text:`Effective communication is essential in any corporate environment. Management experts strongly advise employees to develop active listening skills. [ 1 ] Furthermore, supervisors frequently remind staff to avoid making rash judgments during team meetings. [ 2 ] When disagreements arise, managers suggest holding open discussions rather than ignoring the problem. [ 3 ]`,

 {type:'tf',title:'Task 1. True / False / Not Stated',text:`Elena Rostova has been managing her eco-friendly packaging company since 2018. Over the past eight years, her firm has grown into a major international distributor. Recently, her team has been designing fully biodegradable containers made from agricultural waste. Investors have pledged millions of dollars to support her expansion into Asian markets. Elena believes that persistent innovation is the key to maintaining a competitive edge.`,

/* ================= Gemini (с таймаутом) ================= */
function withTimeout(promise,ms=8000){
  return Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
}
async function geminiBatch(words){
  const key=(GEMINI_KEY||'').trim();
  if(!key||key.indexOf('ВСТАВЬТЕ')===0)return {error:'no-key'};
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=`+encodeURIComponent(key);
  const prompt=`You are an English teacher for B1 students. For EACH word/phrase in the list below return:
- "meaning": a short clear English definition (1 sentence, B1 level)
- "kk": the Kazakh translation
Reply ONLY with a JSON array, same order as input, like:
[{"word":"...","meaning":"...","kk":"..."}, ...]
Words: ${JSON.stringify(words)}`;
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{temperature:0,maxOutputTokens:2048}
    })});
    if(!r.ok){const t=await r.text();return {error:'http',detail:t.slice(0,200)}}
    const data=await r.json();
    const txt=data?.candidates?.[0]?.content?.parts?.[0]?.text||'';
    const m=txt.match(/\[[\s\S]*\]/);if(!m)return {error:'parse'};
    let arr;try{arr=JSON.parse(m[0])}catch(e){return {error:'parse'}};
    return {items:arr};
  }catch(e){return {error:'network',detail:String(e.message||e)}}
}
async function geminiOne(word){const r=await geminiBatch([word]);if(r.error)return r;const it=(r.items||[])[0];if(!it||!it.meaning||!it.kk)return {error:'schema'};return {meaning:String(it.meaning).trim(),kk:String(it.kk).trim(),source:'gemini'}}

  const k=word.toLowerCase();
  if(!force&&S.words[k]&&S.words[k].meaning)return S.words[k];
  let g=null;
  try{g=await withTimeout(geminiOne(word),8000)}catch(e){g={error:'timeout'}}
  if(g&&!g.error){S.words[k]={meaning:g.meaning,kk:g.kk,ts:Date.now()};save();return S.words[k]}
  const fb=fbLookup(word);
  if(fb){S.words[k]={meaning:fb.meaning,kk:fb.kk,ts:Date.now(),fallback:true,error:(g&&g.error)||'gemini'};save();return S.words[k]}
  S.words[k]={meaning:'',kk:'',ts:Date.now(),error:(g&&(g.error+(g.detail?' '+g.detail:'')))||'gemini'};save();
  return S.words[k];
}

function allKnownWords(){
  const set=new Set();
  Object.keys(KW_LESSON).forEach(w=>set.add(w));
  Object.keys(S.words||{}).forEach(w=>set.add(w));
  Object.keys(FALLBACK||{}).forEach(w=>set.add(w));
  return [...set];
}
function markWords(text){
  if(!text)return '';
  text=String(text);
  const known=allKnownWords().filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!known.length)return esc(text);
  const re=new RegExp('\\b(?:'+known.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')).join('|')+')\\b','gi');
  let out='',last=0,m;
  while((m=re.exec(text))){
    const key=m[0].toLowerCase().replace(/\s+/g,' ');
    out+=esc(text.slice(last,m.index))+`<span class="word" data-act="word" data-w="${esc(key)}">${esc(m[0])}${S.fav[key]?'<span class="star">★</span>':''}</span>`;
    last=m.index+m[0].length;
    if(m[0].length===0)re.lastIndex++;
  }
  return out+esc(text.slice(last));
}

function micUI(on){const b=$('#micb');if(b){b.textContent=tr(on?'⏹ Стоп':'🎤 Говорить');b.classList.toggle('g',on)}const h=$('#mich');if(h&&on)h.textContent=tr('Слушаю… говорите по-английски.')}
function toggleMic(i){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return toast('Распознавание речи не поддерживается этим браузером — откройте в Chrome или Edge');
 if(rec){rec.stop();return}
 const ta=document.querySelector('[data-la="'+i+'"]');if(!ta)return;
 let base=ta.value||'';if(base&&!/\s$/.test(base))base+=' ';let fin='';
 const r=rec=new SR();r.lang='en-US';r.interimResults=true;r.continuous=true;
 r.onresult=e=>{let it='';for(let k=e.resultIndex;k<e.results.length;k++){const x=e.results[k];if(x.isFinal)fin+=x[0].transcript.trim()+' ';else it+=x[0].transcript}
  ta.value=base+fin+it;S.lanswers[i]=base+fin;save()};
 r.onerror=e=>{toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Доступ к микрофону запрещён — разрешите его в настройках браузера':e.error==='no-speech'?'Речь не услышана — попробуйте ещё раз':'Ошибка микрофона: '+e.error)};
 r.onend=()=>{rec=null;ta.value=base+fin;S.lanswers[i]=base+fin;save();micUI(false);const h=$('#mich');if(h)h.textContent=tr('Нажмите 🎤 и говорите по-английски — речь превратится в текст. Текст можно править вручную.')};
 try{r.start();micUI(true)}catch(e){rec=null;toast('Ошибка микрофона')}}

{title:'Working from Home',text:`More and more people now work from home, and the change has happened faster than anyone expected. Before 2020, only a small number of companies allowed their employees to work remotely, but today millions of office workers spend at least part of their week at home. Many employees say they save time because they do not have to travel to the office every day. A person who commutes for an hour in each direction can save ten hours a week — time that can be spent on family, hobbies or simply rest. Employees also report that they can organise their day more freely and concentrate better on difficult tasks, because there are fewer interruptions than in a busy open-plan office. Some companies have even closed their expensive city offices and use the money to pay for better home equipment for their staff.

However, remote work is not perfect. Some people feel lonely without their colleagues and miss the small conversations that happen in a kitchen or corridor. Others find it difficult to separate work from free time, and they answer emails late at night or at weekends. For young employees who have just started their careers, learning from experienced colleagues is harder when everyone is at home. Because of these problems, a lot of companies are introducing a hybrid model, where workers come to the office two or three days a week and stay at home on other days. Experts believe this balance will become the most popular way of working in the future, because it offers flexibility and keeps the team together.`,tasks:[

{title:'Learning a Language',text:`Learning a new language as an adult is challenging, but it is certainly possible. Many people believe that only children can learn languages well, yet research shows that adults can make very good progress if they practise regularly. Short daily practice works better than one long lesson every week, because the brain remembers information better when it meets it often. Fifteen minutes a day is enough to notice real improvement after a few months, and a regular routine is more useful than a big effort once a month.

Many learners start with apps, which are cheap and easy to use, but experts say that speaking with real people is just as important. When you speak, you have to think quickly, and this trains your brain to use the language naturally. It is normal to make mistakes, and they are an important part of the process. In fact, learners who are afraid of mistakes usually improve more slowly than those who are not afraid to try. Learners who watch films, listen to podcasts and read simple books usually improve faster because they meet new words in context. It also helps to write a short diary in the new language, even if it is only three or four sentences a day.

The most important thing is to stay motivated, so it helps to set small goals and celebrate every success, for example when you can watch a short video without subtitles or order food in a restaurant. Learning a language is a long journey, but every small step brings you closer to your goal.`,tasks:[

{title:'Why Sleep Matters',text:`Doctors say that most adults need between seven and nine hours of sleep every night. Children and teenagers need even more, because their bodies and brains are still growing. During sleep, the body repairs itself and the brain stores the information we have learned during the day. This is why students who sleep well usually remember more before an exam. People who do not sleep enough often feel tired, find it hard to concentrate and get ill more easily. After several nights of poor sleep, even simple tasks can feel difficult, and people become more emotional and less patient.

Unfortunately, many of us use phones and computers late in the evening, and the bright screens make it harder to fall asleep. The brain sees the light and thinks it is still daytime, so it produces less of the chemical that helps us sleep. To sleep better, experts advise going to bed at the same time every day, avoiding coffee after lunch and keeping the bedroom cool and quiet. A short walk before bed can also help you relax. It is also a good idea to leave your phone in another room and read a paper book instead of scrolling through social media. Some people find that writing down tomorrow's tasks before bed helps them stop worrying and fall asleep faster.

{title:'Street Food Around the World',text:`Street food is popular in almost every country, and it is often the best way to taste the local culture. In Thailand, visitors can buy fresh noodles and fruit from small stands for just a few dollars. In Mexico, tacos are cooked in front of the customer and served with hot sauce. In Turkey, sellers carry trays of bread rings called simit and sell them in busy squares. Street food is usually cheaper than restaurant meals, and the dishes are often made from traditional family recipes that have been passed down for generations.

However, travellers should be careful. It is better to choose stalls with many customers, because this usually means the food is fresh and the seller is trusted by local people. It also helps to eat food that is cooked in front of you and to avoid uncooked salads if you are not sure about the water. Many cities are now organising street food festivals to protect old recipes and to support small family businesses. These festivals also help tourists understand local traditions and can bring money to poorer neighbourhoods.

{title:'Cycling to Work',text:`In many big cities, traffic is a serious problem, so more people are choosing to cycle to work. Cycling is cheap, healthy and good for the environment. A cyclist does not need to pay for petrol or look for a parking space, and the exercise helps people stay fit without going to a gym. A short ride to work can also wake you up and improve your mood before you start the day. Some cities have built special cycle lanes to make the roads safer, and in places like Amsterdam and Copenhagen cycling is a normal part of everyday life.

Even so, cyclists still face dangers, especially in bad weather or when drivers are not careful. Cyclists should always wear a helmet and use lights in the evening. It is also important to follow traffic rules, signal when you turn and keep a safe distance from large lorries. If more people left their cars at home, the air in our cities would be much cleaner, and there would be less noise and more space for people. For many short trips — to the shop, to school or to work — a bicycle is often faster than a car in heavy traffic.

{title:'Teenagers and Social Media',text:`Most teenagers spend several hours a day on social media. They use it to chat with friends, share photos and follow their favourite celebrities. Social media can be useful because it helps young people stay in touch, especially with friends who live far away, and it lets them learn about the world and find communities with the same interests. For some teenagers, online groups are an important source of support when they feel different or alone.

However, it also has disadvantages. Some teenagers compare themselves with the perfect lives they see online and feel unhappy, because people usually post only the best moments of their lives. Others spend so much time on their phones that they do not get enough sleep or exercise, and their schoolwork suffers. Cyberbullying is another serious problem: cruel messages can reach a person at any time of day. Parents often worry, but forbidding phones is not always the answer, because teenagers need to learn how to use technology safely. Many experts suggest agreeing on simple rules together, such as no phones at the dinner table or after ten o'clock at night, and talking openly about what they see online.

{title:'A Volunteer in Kenya',text:`Last summer, a nineteen-year-old student called Maria spent six weeks in Kenya as a volunteer. She worked in a small village school and helped the children learn English. At first it was difficult because she did not speak the local language and the classrooms were very basic. There were no computers, and sometimes there were not enough books for everyone. The school had only three classrooms for more than two hundred children, so lessons were often crowded.

However, the children were friendly and enthusiastic, and Maria soon felt at home. In the evenings she played football with them and learned some words of Swahili. She also helped a local women's group sell hand-made baskets online, which brought extra money to several families. Maria says the experience changed her life. She became more confident and learned to solve problems without help. She now wants to become a teacher and plans to go back to Kenya after university.

She advises other young people to volunteer if they can, but she says it is important to go with an organisation that really helps the local community and does not only take photos for social media. Volunteering, she says, is about listening and learning, not only about giving.`,tasks:[

{title:'The History of Chocolate',text:`Chocolate has a long and interesting history. More than three thousand years ago, people in Central America made a bitter drink from cocoa beans. It was not sweet, and only rich and important people could drink it. The beans were so valuable that they were sometimes used as money. When Spanish explorers brought cocoa to Europe in the sixteenth century, they added sugar, and the new drink quickly became fashionable among wealthy families.

Solid chocolate appeared much later, in the nineteenth century, when new machines made it possible to produce bars cheaply. Soon chocolate factories opened in many European cities, and chocolate became a popular gift. Today people around the world eat millions of tons of chocolate every year. Some scientists even say that dark chocolate can be good for the heart if we eat it in small quantities, because it contains substances that help blood flow. However, most chocolate products also contain a lot of sugar and fat, so it is still a food to enjoy in moderation.

{title:'Online Shopping',text:`Online shopping has changed the way we buy things. Instead of visiting crowded shops, customers can choose products on a website and receive them at home a few days later. Prices are often lower online, and it is easy to compare different shops and read reviews from other buyers. For busy people, this saves a lot of time, and people who live far from big cities can buy things that are not available in local shops.

{title:'Gardens in the City',text:`Many people who live in big cities do not have a garden, so they are creating green spaces on their balconies, roofs and even on empty land between buildings. These community gardens are becoming more popular every year. Neighbours grow vegetables, herbs and flowers together, and they share what they produce. In some cities there are waiting lists to get a small piece of land, because so many people want to grow their own food.

 r.tasks.forEach((t,ti)=>{all+=taskMax(t.type,t);ok+=taskScore(t.type,t,getAns(n,ti))});
 const done=r.tasks.every((t,ti)=>isTaskDone(t.type,t,getAns(n,ti))),wc=r.text.split(/\s+/).length;
 return `<button class="btn g" data-act="rback">← Все тексты</button><h1 style="margin-top:14px">📰 Reading ${S.rcur}: ${esc(r.title)}</h1><p class="sub">B1 · ${wc} слов</p>

async function translateAllFav(){
  const keys=Object.keys(S.fav);
  if(!keys.length)return toast('Избранное пусто');
  const need=keys.filter(w=>!S.words[w.toLowerCase()]?.meaning);
  if(!need.length)return toast('Все слова уже переведены ✓');
  toast('Перевод '+need.length+' слов…');
  const r=await geminiBatch(need);
  if(r.error){await Promise.all(need.map(w=>ensureWord(w)))}
  else{(r.items||[]).forEach(it=>{if(!it||!it.word)return;const k=String(it.word).toLowerCase();if(it.meaning&&it.kk)S.words[k]={meaning:it.meaning,kk:it.kk,ts:Date.now()}});
    const missing=need.filter(w=>!S.words[w.toLowerCase()]?.meaning);if(missing.length)await Promise.all(missing.map(w=>ensureWord(w)));save()}
  render();toast('Готово ✓');
}

/* ================= AI (только FAB) ================= */
function chat(open){const c=$('#chat');c.classList.toggle('open',open===undefined?!c.classList.contains('open'):open);if(c.classList.contains('open')&&!$('#msgs').children.length)say('b','Привет! Я Bilimup AI. Объясню грамматику и дам подсказки, но готовые ответы на задания не выдаю — вы справитесь сами 💪')}
function say(w,x){const d=document.createElement('div');d.className='m '+w;d.textContent=w==='b'?tr(x):x;$('#msgs').append(d);$('#msgs').scrollTop=1e9}
function tutor(m){const l=m.toLowerCase();if(/ответ|answer|solution|реши|решени|какой вариант|правильн|что вписать|which option/.test(l))return 'Прямой ответ я не дам — так знание не закрепится. Посмотрите Grammar Focus урока и попробуйте ещё раз.';if(/present|настоящ/.test(l))return 'Present Simple — привычки и факты: I work, he works. Present Continuous — сейчас: I am working.';if(/past|прошед/.test(l))return 'Past Simple — законченное действие: worked, went. Past Continuous — процесс: was working. Past Perfect — до другого действия: had worked.';if(/article|артикл/.test(l))return 'a/an — первое упоминание; the — известный предмет; без артикля — общие понятия во мн. числе.';if(/passive|пассив/.test(l))return 'Passive: be + V3. The bridge was built. Causative: have/get + object + V3.';if(/conditional|условн/.test(l))return '1st: If + Present, will + V. 2nd: If + Past, would + V. 3rd: If + Past Perfect, would have + V3.';if(/привет|hello|hi\b/.test(l))return 'Привет! С чем помочь: грамматика, задание или эссе?';return 'Подсказка: откройте урок, прочитайте Grammar Focus и выполните задания по порядку. Ответы откроются после выполнения всех заданий.'}
function send(){const i=$('#ci'),m=i.value.trim();if(!m)return;i.value='';say('u',m);setTimeout(()=>say('b',tutor(m)),350)}
$('#fab').onclick=()=>chat();$('#cs').onclick=send;$('#ci').onkeydown=e=>{if(e.key==='Enter')send()};
