<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilimup — Кабинет преподавателя</title><style>
:root{--bg:#0b1024;--tx:#eaf0ff;--mu:#93a0c6;--ac:#5eead4;--ac2:#8b5cf6;--ok:#34d399;--bad:#f87171;--wn:#fbbf24;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.13);--in:rgba(0,0,0,.25);--sf:#141a3a;--hv:rgba(255,255,255,.08);--g1:#26307a55;--g2:#0f766e55;color-scheme:dark}
[data-theme=light]{--bg:#eef2ff;--tx:#1b2140;--mu:#5b6488;--ac:#0d9488;--ok:#059669;--bad:#dc2626;--wn:#b45309;--gl:rgba(255,255,255,.72);--bd:rgba(30,40,100,.15);--in:rgba(255,255,255,.9);--sf:#fff;--hv:rgba(30,40,100,.07);--g1:#a5b4fc77;--g2:#99f6e488;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(900px 600px at 10% -10%,var(--g1),transparent),radial-gradient(700px 500px at 100% 100%,var(--g2),transparent),var(--bg);display:flex;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.glass{background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
aside{width:270px;flex:none;padding:18px;display:flex;flex-direction:column;gap:16px;height:100%;overflow:auto;border-radius:0 22px 22px 0;z-index:20;transition:transform .3s}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}.logo small{display:block;font-weight:500;font-size:12px;color:var(--mu)}
.prof{display:flex;gap:12px;align-items:center;padding:12px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac2),var(--ac));display:grid;place-items:center;font-weight:800;font-size:20px;color:#0b1024;flex:none}
.prof b{display:block}.prof span{font-size:13px;color:var(--mu)}
nav{display:flex;flex-direction:column;gap:6px}
nav button{background:none;border:1px solid transparent;text-align:left;padding:11px 13px;border-radius:12px;color:var(--mu);transition:.2s}
nav button:hover{background:var(--gl);color:var(--tx)}
nav button.on{background:linear-gradient(90deg,#8b5cf633,#5eead422);border-color:var(--bd);color:var(--tx)}
main{flex:1;min-width:0;height:100%;overflow:auto;padding:26px 30px 110px}
.fade{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;letter-spacing:-.5px;margin-bottom:6px}h2{font-size:19px;margin:24px 0 12px}
p.sub{color:var(--mu);margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{padding:16px}
.stat b{font-size:30px;display:block;letter-spacing:-1px}.stat span{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:9px;background:var(--hv);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .5s}
.lv{cursor:pointer;text-align:left;transition:.2s}.lv:hover{transform:translateY(-3px)}.lv.on{border-color:var(--ac)}
.lv b{font-size:24px}
.btn{background:linear-gradient(90deg,var(--ac2),#6366f1);border:0;padding:11px 20px;border-radius:12px;font-weight:700;color:#fff;transition:.2s}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:var(--gl);border:1px solid var(--bd)}
.ls{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:8px;width:100%;text-align:left;border-radius:14px;background:var(--gl);border:1px solid var(--bd)}
.ls[data-s=lock]{opacity:.5;cursor:not-allowed}.ls em{margin-left:auto;font-style:normal;font-size:13px}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;background:#000}
textarea{width:100%;min-height:150px;margin-top:12px;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:12px;resize:vertical}
.cnt{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;font-weight:700;font-size:13px}
.cnt.r,.bg.r{background:#f8717133;color:var(--bad)}.cnt.g,.bg.g{background:#34d39933;color:var(--ok)}
.bg{font-size:12px;padding:3px 10px;border-radius:99px;margin-left:8px;vertical-align:middle;font-weight:600}
.art{margin-bottom:14px;color:var(--tx);max-width:70ch}
.q{margin-bottom:14px}.opt{display:block;width:100%;text-align:left;margin-top:6px;padding:9px 13px;border-radius:10px;background:var(--hv);border:1px solid var(--bd);transition:.15s}
.opt:hover{border-color:var(--ac)}.opt.ok,input.ok{background:#34d39926;border-color:var(--ok)}.opt.bad,input.bad{background:#f8717126;border-color:var(--bad)}
.gap{line-height:2.4;font-size:17px;max-width:70ch}
.gap input{background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:3px 8px;text-align:center;min-width:60px}
input.nm{width:100%;padding:12px;margin:10px 0;border-radius:12px;border:1px solid var(--bd);background:var(--in)}
.mod{position:fixed;inset:0;background:rgba(5,8,20,.75);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:60;padding:16px}
.mod .glass{max-width:440px;width:100%;padding:26px;background:var(--sf)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chips button{padding:8px 16px;border-radius:99px;background:var(--gl);border:1px solid var(--bd)}
#fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;font-size:26px;background:linear-gradient(135deg,var(--ac2),var(--ac));box-shadow:0 8px 24px #8b5cf688;z-index:40;transition:.2s}
#fab:hover{transform:scale(1.08)}
#chat{position:fixed;right:20px;bottom:90px;width:360px;max-width:calc(100vw - 32px);height:460px;max-height:calc(100% - 120px);display:none;flex-direction:column;z-index:41;background:var(--sf);overflow:hidden}
#chat.open{display:flex;animation:in .25s}
#chat header{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--bd)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--ac2)}.m.b{background:var(--hv)}
#cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}#cf input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--in)}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#0f766e;padding:10px 20px;border-radius:12px;z-index:80;display:none;font-weight:600}
#burger{display:none}
@media(max-width:820px){
body{display:block}
aside{position:fixed;left:0;top:0;transform:translateX(-105%);background:var(--sf);width:280px}
aside.open{transform:none}
#burger{display:block;position:fixed;top:12px;left:12px;z-index:30;padding:8px 13px;border-radius:12px;background:var(--sf);border:1px solid var(--bd)}
main{padding:64px 16px 110px}.two{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.rec{background:#ef4444!important;animation:pl 1s infinite}@keyframes pl{50%{opacity:.6}}
.err{border-left:3px solid var(--bad);padding:8px 12px;margin:8px 0;background:var(--hv);border-radius:8px}.err.good{border-color:var(--ok)}
.mk{background:#f8717155;color:inherit;border-radius:4px;padding:0 2px}
.wd{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:10px;align-items:center;padding:10px 14px;margin-bottom:6px;border-radius:12px;background:var(--gl);border:1px solid var(--bd)}.wd small{color:var(--mu)}
@media(max-width:820px){.wd{grid-template-columns:1fr auto}.wd small{grid-column:1}}
.av{background-size:cover;background-position:center}.av.sm{width:34px;height:34px;font-size:14px}
select.nm{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid var(--bd);background:var(--in)}
.tr{display:flex;gap:12px;align-items:center;padding:10px 14px;margin-bottom:6px;border-radius:12px;background:var(--gl);border:1px solid var(--bd);width:100%;text-align:left}.tr b{flex:1}
</style></head><body>
<button id="burger" aria-label="Меню">☰</button>
<aside class="glass"><div class="logo">✦ Bilimup<small>Кабинет преподавателя</small></div>
<div class="prof glass"><div class="av" id="av"></div><div><b id="pn"></b><span>Преподаватель</span></div></div>
<nav id="nav"></nav><button class="btn g" id="th" style="margin-top:auto"></button><button class="btn g" id="lo">Выйти</button></aside>
<main id="main"></main><div id="toast"></div><div id="auth" class="mod" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
const SB_URL='https://krqdjbpfaxrgacwepfrh.supabase.co',SB_KEY='sb_publishable_0ToxddIj6oJMli2E6bmAFA_1_O0Zew0';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:'bilimup-teacher'}}):null;
function avFile(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,128,128);cb(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)}
const avt=(av,n,c)=>`<span class="av ${c||''}" style="${av?`background-image:url(${av})`:''}">${av?'':esc((n||'?')[0].toUpperCase())}</span>`;
const avg=o=>{const v=Object.values(o||{});return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):'—'};
const fl=(p,n)=>p?`<a href="#" data-act="openf" data-p="${esc(p)}" style="color:var(--ac)">📎 ${esc(n||'файл')}</a>`:'';
const LV=['A1','A2','B1','B2','C1'];
let me=null,view='st',sel=null,C={s:[],t:[],b:[]},nmT=null;
document.documentElement.dataset.theme=localStorage.getItem('bm_theme')||'dark';
const mail=l=>l+'@bilimup.app';

/* ---------- ВХОД / РЕГИСТРАЦИЯ ---------- */
function authUI(reg){const o=$('#auth');o.style.display='grid';
o.innerHTML=`<div class="glass"><h1>Bilimup · Преподаватель</h1><p class="sub">${reg?'Регистрация':'Вход'}</p>${reg?'<input class="nm" id="fn" placeholder="Полное ФИО" autocomplete="name">':''}<input class="nm" id="lg" placeholder="Логин (латиница, цифры)" autocomplete="username"><input class="nm" id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="${reg?'new-password':'current-password'}">${reg?'<input class="nm" id="cd" placeholder="Секретное слово для преподавателей" autocomplete="off">':''}<button class="btn" id="ok" style="width:100%">${reg?'Зарегистрироваться':'Войти'}</button><button class="btn g" id="sw" style="width:100%;margin-top:8px">${reg?'Уже есть аккаунт — войти':'Создать аккаунт преподавателя'}</button></div>`;
$('#sw').onclick=()=>authUI(!reg);
$('#ok').onclick=async()=>{if(!sb)return toast('Не загрузился модуль Supabase — проверьте интернет');
const lg=$('#lg').value.trim().toLowerCase(),pw=$('#pw').value;
if(!/^[a-z0-9._-]{3,}$/.test(lg))return toast('Логин: латиница, цифры, . _ - (от 3 символов)');
if(reg){const fn=$('#fn').value.trim();if(fn.split(/\s+/).length<2)return toast('Введите полное ФИО');if(pw.length<6)return toast('Пароль — от 6 символов');
let r=await sb.auth.signUp({email:mail(lg),password:pw});
if(r.error&&/registered/i.test(r.error.message)){r=await sb.auth.signInWithPassword({email:mail(lg),password:pw});if(r.error)return toast('Такой логин уже занят')}
else if(r.error)return toast('Ошибка: '+r.error.message);
if(!r.data.session)return toast('В Supabase отключите «Confirm email» (Authentication → Sign In / Providers → Email)');
const g=await sb.rpc('register_teacher',{p_name:fn,p_login:lg,p_code:$('#cd').value.trim()});
if(g.error){await sb.auth.signOut();return toast(/bad code/.test(g.error.message)?'Неверное секретное слово':/duplicate/.test(g.error.message)?'Вы уже зарегистрированы — нажмите «войти»':'Ошибка: '+g.error.message)}}
else{const r=await sb.auth.signInWithPassword({email:mail(lg),password:pw});if(r.error)return toast('Неверный логин или пароль')}
boot()}}
async function boot(){if(!sb){authUI(false);return toast('Не загрузился модуль Supabase — проверьте интернет')}
const r=await sb.auth.getSession(),u=r.data.session&&r.data.session.user;if(!u){authUI(false);return}
const t=await sb.from('teachers').select('*').eq('id',u.id).maybeSingle();
if(!t.data){await sb.auth.signOut();authUI(false);return toast('Это не аккаунт преподавателя')}
me={id:u.id,lg:t.data.login,name:t.data.full_name,av:t.data.avatar||''};$('#auth').style.display='none';render();load(true)}
async function load(force){if(!me)return;const [s,t,b]=await Promise.all([sb.from('students').select('*').order('updated_at',{ascending:false}),sb.from('tasks').select('*').order('created_at',{ascending:false}),sb.from('submissions').select('*').order('created_at',{ascending:false})]);
if(s.error||t.error||b.error)return toast('Не удалось загрузить данные');C={s:s.data,t:t.data,b:b.data};
if(force||!document.activeElement.matches('input,textarea,select'))render()}

/* ---------- ВИДЫ ---------- */
function students(){return `<h1>Ученики</h1><p class="sub">Прогресс, оценки и ошибки учеников в реальном времени (обновляется каждые 20 секунд).</p>`+
(C.s.length?C.s.map(s=>`<button class="tr" data-act="sel" data-id="${s.id}">${avt(s.avatar,s.full_name,'sm')}<b>${esc(s.full_name)}</b><span>${s.level}</span><span>${(s.done||[]).length}/50</span><span class="cnt ${avg(s.scores)>=70?'g':'r'}" style="margin:0">${avg(s.scores)}</span></button>`).join(''):'<p class="sub">Пока ни один ученик не вошёл на сайт.</p>')}
function detail(s){const B=C.b.filter(x=>x.student_id===s.id),cnt={};let rw=0;
Object.values(s.errs||{}).forEach(e=>{rw+=e.r||0;(e.g||[]).forEach(m=>cnt[m]=(cnt[m]||0)+1)});
const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8),sc=Object.entries(s.scores||{});
return `<button class="btn g" data-act="back">← Все ученики</button>
<div style="display:flex;gap:14px;align-items:center;margin:16px 0">${avt(s.avatar,s.full_name)}<div><h1 style="margin:0">${esc(s.full_name)}</h1><span class="sub">Уровень ${s.level} · серия ${s.streak} 🔥</span></div></div>
<div class="grid"><div class="card glass stat"><b>${(s.done||[]).length}/50</b><span>Пройдено уроков</span></div><div class="card glass stat"><b>${avg(s.scores)}</b><span>Средняя оценка за уроки</span></div><div class="card glass stat"><b>${rw}</b><span>Неверных ответов в Reading</span></div><div class="card glass stat"><b>${B.length}</b><span>Сдано работ</span></div></div>
<h2>Оценки за уроки на сайте</h2><div class="chips">${sc.map(([k,v])=>`<span class="cnt ${v>=70?'g':'r'}" style="margin:0">${k}: ${v}</span>`).join('')||'<span class="sub">Нет данных</span>'}</div>
<h2>Частые ошибки в текстах</h2>${top.map(([m,n])=>`<div class="err"><b>×${n}</b> ${esc(m)}</div>`).join('')||'<p class="sub">Ошибок не найдено (или ученик ещё не проверял текст).</p>'}
<h2>Работы по заданиям</h2>${B.map(x=>{const t=C.t.find(t=>t.id===x.task_id);return `<div class="err ${x.grade!=null?'good':''}"><b>${esc(t?t.title:'Задание удалено')}</b> — ${x.grade!=null?'оценка '+x.grade+'/100 · '+esc(x.teacher_name):'ожидает проверки'}</div>`}).join('')||'<p class="sub">Работ пока нет.</p>'}`}
function tasks(){return `<h1>Задания</h1><div class="glass card" style="max-width:640px;margin-bottom:18px"><b>Новое задание</b>
<input class="nm" id="tt" placeholder="Название" autocomplete="off"><select class="nm" id="tl">${LV.map(l=>`<option>${l}</option>`).join('')}</select>
<textarea id="td" placeholder="Описание / инструкция" style="min-height:90px"></textarea>
<p class="sub" style="margin:10px 0 4px">Файл: PDF, Word или фото (до 5 МБ)</p><input type="file" id="tf" accept=".pdf,.doc,.docx,image/*"><br><button class="btn" data-act="addt" style="margin-top:12px">Опубликовать</button></div>`+
C.t.map(t=>`<div class="glass card" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:18px">${esc(t.title)}</b><span class="bg g">${t.level}</span><small style="color:var(--mu)">${esc(t.teacher_name)} · работ: ${C.b.filter(x=>x.task_id===t.id).length}</small><button class="btn g" data-act="delt" data-id="${t.id}" style="margin-left:auto;padding:4px 12px">Удалить</button></div><p class="art" style="margin:8px 0">${esc(t.descr)}</p>${fl(t.file_path,t.file_name)}</div>`).join('')||'<p class="sub">Заданий пока нет.</p>'}
function review(){const S=[...C.b].sort((a,b)=>(a.grade!=null)-(b.grade!=null));
return `<h1>Проверка работ</h1><p class="sub">Сначала — ещё не проверенные.</p>`+(S.map(x=>{const t=C.t.find(t=>t.id===x.task_id);return `<div class="glass card" style="margin-bottom:14px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${esc(x.student_name)}</b><span class="bg ${x.grade!=null?'g':'r'}">${x.grade!=null?'проверено':'ждёт'}</span><small style="color:var(--mu)">${esc(t?t.title:'Задание удалено')}</small></div>
<p class="art" style="margin:8px 0">${esc(x.answer)||'<i>Без текста</i>'}</p>${fl(x.file_path,x.file_name)}
<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap"><input class="nm" type="number" min="0" max="100" data-g="${x.id}" placeholder="Оценка 0–100" value="${x.grade!=null?x.grade:''}" style="width:160px;margin:0"><input class="nm" data-c="${x.id}" placeholder="Комментарий ученику" value="${esc(x.comment||'')}" style="flex:1;min-width:200px;margin:0"><button class="btn" data-act="grade" data-k="${x.id}">Сохранить</button></div></div>`}).join('')||'<p class="sub">Работ пока нет.</p>')}
function settings(){return `<h1>Профиль</h1><div class="glass card" style="max-width:480px"><label>Полное ФИО</label><input class="nm" id="nm" value="${esc(me.name)}"><label>Аватар</label><input type="file" id="avf" accept="image/*" style="display:block;margin:8px 0 14px"><p class="sub">Логин: ${esc(me.lg)}</p></div>`}

/* ---------- НАВИГАЦИЯ ---------- */
const NAV=[['st','👥 Ученики'],['tk','📝 Задания'],['rv','✅ Проверка работ'],['se','⚙️ Профиль']];
$('#nav').innerHTML=NAV.map(([k,t])=>`<button data-v="${k}">${t}</button>`).join('');
function render(){if(!me)return;const m=$('#main');m.classList.remove('fade');void m.offsetWidth;m.classList.add('fade');
const s=sel&&C.s.find(x=>x.id===sel);m.innerHTML=view==='st'?(s?detail(s):students()):view==='tk'?tasks():view==='rv'?review():settings();
$('#pn').textContent=me.name;$('#av').style.backgroundImage=me.av?`url(${me.av})`:'';$('#av').textContent=me.av?'':me.name[0].toUpperCase();
$('#th').textContent=document.documentElement.dataset.theme==='light'?'🌙 Тёмная тема':'☀️ Светлая тема';
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;sel=null;$('aside').classList.remove('open');render();load(true)}};
window.addEventListener('focus',()=>load());
$('#burger').onclick=()=>$('aside').classList.toggle('open');
$('#th').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('bm_theme',t);render()};
$('#lo').onclick=async()=>{if(sb)await sb.auth.signOut();me=null;$('#main').innerHTML='';boot()};
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='sel'){sel=b.dataset.id;render()}
else if(a==='back'){sel=null;render()}
else if(a==='openf'){e.preventDefault();sb.storage.from('files').createSignedUrl(b.dataset.p,300).then(r=>r.error?toast('Не удалось открыть файл'):window.open(r.data.signedUrl,'_blank','noopener'))}
else if(a==='addt'){(async()=>{const ti=$('#tt').value.trim();if(!ti)return toast('Укажите название');const f=$('#tf').files[0];if(f&&f.size>5e6)return toast('Файл больше 5 МБ');b.disabled=true;const id=crypto.randomUUID();let fp=null;
if(f){fp='tasks/'+id+'/'+f.name.replace(/[^\w.\-]+/g,'_');const u=await sb.storage.from('files').upload(fp,f);if(u.error){b.disabled=false;return toast('Файл не загрузился: '+u.error.message)}}
const r=await sb.from('tasks').insert({id,title:ti,level:$('#tl').value,descr:$('#td').value.trim(),file_path:fp,file_name:f?f.name:null,teacher_id:me.id,teacher_name:me.name,teacher_avatar:me.av||null});b.disabled=false;if(r.error)return toast('Ошибка: '+r.error.message);toast('Задание опубликовано ✓');load(true)})()}
else if(a==='delt'){if(!confirm('Удалить задание и работы по нему?'))return;(async()=>{const id=b.dataset.id,t=C.t.find(x=>x.id===id),ps=[t&&t.file_path,...C.b.filter(x=>x.task_id===id).map(x=>x.file_path)].filter(Boolean);if(ps.length)await sb.storage.from('files').remove(ps);const r=await sb.from('tasks').delete().eq('id',id);if(r.error)return toast('Ошибка: '+r.error.message);load(true)})()}
else if(a==='grade'){(async()=>{const id=b.dataset.k,g=$(`[data-g="${id}"]`).value;if(g===''||+g<0||+g>100)return toast('Оценка — число от 0 до 100');
const r=await sb.from('submissions').update({grade:+g,comment:$(`[data-c="${id}"]`).value.trim(),teacher_id:me.id,teacher_name:me.name,teacher_avatar:me.av||null,graded_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast('Ошибка: '+r.error.message);toast('Оценка сохранена ✓');load(true)})()}});
$('#main').addEventListener('change',e=>{const t=e.target;if(t.id==='avf'&&t.files[0])avFile(t.files[0],async d=>{const r=await sb.from('teachers').update({avatar:d}).eq('id',me.id);if(r.error)return toast('Ошибка: '+r.error.message);me.av=d;render();toast('Аватар обновлён ✓')})});
$('#main').addEventListener('input',e=>{if(e.target.id==='nm'){const v=e.target.value.trim();if(v){clearTimeout(nmT);nmT=setTimeout(async()=>{await sb.from('teachers').update({full_name:v}).eq('id',me.id);me.name=v;$('#pn').textContent=v},800)}}});
setInterval(()=>{if(me)load()},20000);
boot();

</script></body></html>
